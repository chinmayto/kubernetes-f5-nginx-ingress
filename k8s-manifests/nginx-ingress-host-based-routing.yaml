# Host-based routing in a single namespace.
#
# Both apps live in the "simple-nodejs-app" namespace, so one Ingress can
# reference both Services. Each host maps to a different app:
#   app1.chinmayto.com -> service-nodejs-app-1
#   app2.chinmayto.com -> service-nodejs-app-2
#
# Each host routes "/" straight to its backend, so no URI rewriting is needed
# (and no nginx.org/rewrites annotation) - the request path "/" passes through
# to the app unchanged.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simple-nodejs-ingress
  namespace: simple-nodejs-app
spec:
  ingressClassName: nginx
  rules:
    - host: app1.chinmayto.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: service-nodejs-app-1
                port:
                  number: 80
    - host: app2.chinmayto.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: service-nodejs-app-2
                port:
                  number: 80
